services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/files:ro
    depends_on:
      - renderer
  renderer:
    build:
      context: .
      dockerfile: renderer/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/files
      - ${KOKORO_ASSETS_DIR:-./data/voices}:/files/voices:ro
      - ${VIDEO_PREVIEWS_DIR:-./data/previews}:/previews
volumes:
  n8n_data:
